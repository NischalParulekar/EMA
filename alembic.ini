# Alembic configuration for EMA.
# Note: the app currently creates tables via init_db() (Base.metadata.create_all)
# in backend/db/database.py. This file is present per the project structure; wire
# up migrations in a later phase if needed.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://ema_user:ema_pass@localhost:5432/ema_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
