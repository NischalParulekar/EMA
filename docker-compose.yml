version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ema_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ema_postgres
    environment:
      POSTGRES_USER: ema_user
      POSTGRES_PASSWORD: ema_pass
      POSTGRES_DB: ema_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ema_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
